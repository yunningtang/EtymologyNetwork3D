<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etymology Network 词源星图</title>
<meta name="description" content="Explore 200+ word roots and 1300+ English words through an interactive 3D network visualization. Master English vocabulary through visual etymology.">
<meta property="og:title" content="Etymology Network 词源星图">
<meta property="og:description" content="See how English words connect — 200+ roots, 1300+ words, one living 3D network.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Etymology Network 词源星图">
<meta name="twitter:description" content="Explore English word origins through an interactive 3D network visualization.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/theme-kid.css">
</head>
<body class="kid">

<!-- Loading -->
<div id="loading">
  <div class="brand-load">Etymology Network</div>
  <div class="loader-ring"></div>
  <div id="load-status">正在点亮词根星球…</div>
  <div id="load-progress"><div id="load-bar"></div></div>
</div>

<!-- Intro Overlay -->
<div id="intro-overlay">
  <div class="tagline">每个英语单词，都是拼出来的</div>
  <div class="tagline-sub">206 个词根星球 · 6,000 多个单词 · 一张会动的星图</div>
</div>

<!-- Hint -->
<div id="hint">
  <span class="pulse-dot"></span>
  <span>点一颗星球，看看它藏着哪些单词</span>
</div>

<!-- Top Bar -->
<div id="topbar">
  <div id="brand">Etymology Network</div>
  <div id="metrics">
    Words <b id="m-nodes">0</b> &nbsp;·&nbsp; Morphemes <b id="m-clusters">0</b> &nbsp;·&nbsp; Connections <b id="m-edges">0</b>
  </div>
</div>

<!-- Search -->
<div id="search-wrap">
  <svg id="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input id="search" type="text" placeholder="搜一个单词或词根，比如 port、biology" autocomplete="off" spellcheck="false">
  <button id="search-clear" aria-label="Clear search">&times;</button>
  <span id="search-count"></span>
  <div id="search-dropdown"></div>
</div>

<!-- Exam level filter -->
<div id="level-filters" role="group" aria-label="考试等级筛选">
  <button class="lv-btn active" data-lv="zg">初高中</button>
  <button class="lv-btn" data-lv="z">中考</button>
  <button class="lv-btn" data-lv="g">高考</button>
  <button class="lv-btn" data-lv="46">四六级</button>
  <button class="lv-btn" data-lv="k">考研</button>
  <button class="lv-btn" data-lv="ti">托福雅思</button>
  <button class="lv-btn" data-lv="">全部</button>
</div>

<!-- Filters -->
<div id="filters">
  <button class="filter-btn active" data-type="all">全部</button>
  <button class="filter-btn" data-type="p"><span class="dot" style="background:var(--cyan)"></span>前缀</button>
  <button class="filter-btn" data-type="r"><span class="dot" style="background:var(--mint)"></span>词根</button>
  <button class="filter-btn" data-type="s"><span class="dot" style="background:var(--pink)"></span>后缀</button>
</div>
<div id="sub-filters"></div>

<!-- Instructions -->
<div id="instructions">
  拖拽旋转 · 滚轮缩放<br>
  <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 旋转 &nbsp; <kbd>+</kbd><kbd>−</kbd> 缩放 &nbsp; <kbd>Enter</kbd> 选中中间那颗<br>
  <kbd>/</kbd> 搜索 &nbsp; <kbd>Esc</kbd> 回到全图
</div>

<!-- Study Toggle & Panel -->
<button id="study-toggle" aria-label="Study progress 学习进度" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="flex-shrink:0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
  <span id="study-badge"></span>
</button>
<button id="quest-btn" title="今天探索：10 道小题闯关">🚀 <span>今天探索</span></button>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<div id="study-panel">
  <div id="sp-header">
    <h3>我的探险</h3>
    <button id="sp-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="sp-theme">主题 <button class="tt-chip" id="theme-toggle">切换到星空</button></div>
  <div id="sp-stats"></div>
  <div id="sp-favs"></div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div id="tooltip-inner">
    <div class="tt-header">
      <div class="badge" id="tt-badge"></div>
      <div style="display:flex;gap:4px;align-items:center">
        <button id="tt-guess" class="tt-chip" title="猜词模式：先看词素拆解，再揭晓释义" style="display:none">猜词模式</button>
        <button id="tt-back" title="Back 返回" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="tt-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="tt-label-row">
      <div class="label" id="tt-label"></div>
      <button id="tt-fav" title="收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div class="tt-ipa" id="tt-ipa" style="display:none"></div>
    <div class="tt-image" id="tt-image" style="display:none"></div>
    <div class="origin" id="tt-origin"></div>
    <div class="meaning" id="tt-meaning"></div>
    <div class="tt-story" id="tt-story" style="display:none"></div>
    <div class="tt-etymology" id="tt-etymology" style="display:none"></div>
    <div class="tt-compare" id="tt-compare" style="display:none"></div>
    <div class="words-list" id="tt-words"></div>
    <div class="word-count" id="tt-count"></div>
    <div class="tt-related" id="tt-related" style="display:none"></div>
  </div>
</div>

<!-- View Toggle -->
<div id="view-toggle">
  <button class="view-btn active" data-view="3d">🪐 星图</button>
  <button class="view-btn" data-view="2d">🗺️ 地图</button>
</div>

<!-- 2D Mindmap -->
<div id="mindmap-container">
  <canvas id="mindmap-canvas"></canvas>
</div>
<div id="mindmap-hint">点一个词根，展开它的单词家族</div>

<!-- Label canvas for morpheme names -->
<canvas id="label-canvas"></canvas>

<script src="vendor/three.min.js"></script>
<script src="data/words.js"></script>
<script src="data/images.js"></script>
<script src="src/morphemes.js"></script>
<script src="src/icons.js"></script>
<script src="src/data.js"></script>
<script src="src/search.js"></script>
<script src="src/graph.js"></script>
<script src="src/scene3d.js"></script>
<script src="src/study.js"></script>
<script src="src/highlight.js"></script>
<script src="src/tooltip.js"></script>
<script src="src/ui.js"></script>
<script src="src/loop.js"></script>
<script src="src/mindmap.js"></script>
<script src="src/quest.js"></script>
<script src="src/main.js"></script>
</body>
</html>
